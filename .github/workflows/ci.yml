name: CI

# Runs on every push and every pull request
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Lint (typos and undefined names)
        run: npm run lint
      - name: Unit tests
        run: npm test
